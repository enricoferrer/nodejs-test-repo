<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deploy realizado com sucesso</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #f1f5f9;
  }
  .card {
    text-align: center;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 3rem 4rem;
  }
  .check {
    font-size: 3rem;
    margin-bottom: 1rem;
  }
  h1 {
    margin: 0 0 0.5rem;
    font-size: 1.75rem;
  }
  p {
    color: #94a3b8;
    margin: 0.25rem 0;
  }
  code {
    background: rgba(255, 255, 255, 0.1);
    padding: 0.15rem 0.5rem;
    border-radius: 6px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">&#9989;</div>
    <h1>App implantado com sucesso na AWS!</h1>
    <p id="message">Carregando informa&ccedil;&otilde;es...</p>
    <p>Host: <code id="hostname">-</code></p>
    <p>Vers&atilde;o: <code id="version">-</code></p>
  </div>

  <script>
    fetch('/api/status')
      .then((res) => res.json())
      .then((data) => {
        document.getElementById('message').textContent = data.message;
        document.getElementById('hostname').textContent = data.hostname;
        document.getElementById('version').textContent = data.version;
      })
      .catch(() => {
        document.getElementById('message').textContent = 'Não foi possível carregar os dados da API.';
      });
  </script>
</body>
</html>
